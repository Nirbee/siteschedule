# Local development services. Production compose lives in deploy/ (M3).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: para
      POSTGRES_PASSWORD: para
      POSTGRES_DB: para
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U para -d para"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
