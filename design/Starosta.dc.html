<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пара — панель старосты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2448D8}a:hover{color:#16309A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Manrope', system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column; padding: 28px 18px 24px; gap: 18px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Starosta.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E4DE; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div>
<div style="font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #5B606B; text-transform: uppercase; letter-spacing: 0.08em">Режим старосты</div>
<h1 style="margin: 2px 0 0; font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700">Изменение в расписании</h1>
</div>
</div>

<div role="radiogroup" aria-label="Тип изменения" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 14px; background: #F3F4F1">
<sc-for list="{{types}}" as="t" hint-placeholder-count="3">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><button onClick="{{t.pick}}" style="height: 44px; border-radius: 10px; border: none; background: #15171C; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">{{t.label}}</button></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}"><button onClick="{{t.pick}}" style="height: 44px; border-radius: 10px; border: none; background: transparent; color: #3D414A; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{t.label}}</button></sc-if>
</sc-for>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3D414A">Какая пара
<select style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8D0; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #15171C">
<option>Ср, 7 окт · 17:20 · Аудит ИБ</option>
<option>Пн, 5 окт · 15:40 · Управление ИБ</option>
</select>
</label>

<sc-if value="{{isMove}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3D414A">Новая дата
<input type="text" value="Сб, 10 окт" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8D0; font-family: inherit; font-size: 15px; box-sizing: border-box; width: 100%">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3D414A">Время
<input type="text" value="10:00" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8D0; font-family: 'JetBrains Mono', monospace; font-size: 15px; box-sizing: border-box; width: 100%">
</label>
</div>
</sc-if>
<sc-if value="{{isReplace}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3D414A">Что будет вместо
<select style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #D5D8D0; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #15171C">
<option>Правовое обеспечение ИБ</option>
<option>Криптографические протоколы</option>
</select>
</label>
</sc-if>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #3D414A">Комментарий для группы
<textarea rows="3" style="padding: 12px; border-radius: 12px; border: 1px solid #D5D8D0; font-family: inherit; font-size: 15px; line-height: 1.45; resize: none">Аудитория 210, принести ноутбуки.</textarea>
</label>

<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; font-weight: 600">
<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2448D8">
Продублировать в Telegram-чат группы
</label>

<div style="padding: 14px; border-radius: 14px; background: #F3F4F1; font-size: 14px; line-height: 1.45; color: #3D414A">
<div style="font-size: 12px; font-weight: 700; color: #5B606B; margin-bottom: 6px">Так увидят однокурсники</div>
<strong style="color: #15171C">{{preview}}</strong>
</div>

<button style="margin-top: auto; height: 54px; border-radius: 14px; border: none; background: #2448D8; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Опубликовать для группы</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { type: 'move' }; }
  renderVals() {
    var self = this;
    var list = [{ id: 'cancel', label: 'Отмена' }, { id: 'replace', label: 'Замена' }, { id: 'move', label: 'Перенос' }];
    var previews = {
      cancel: 'Аудит ИБ в среду, 7 октября, отменён.',
      replace: 'В среду, 7 октября, вместо Аудита ИБ — Правовое обеспечение ИБ.',
      move: 'Аудит ИБ переносится со среды, 7 октября, на субботу, 10 октября, 10:00.'
    };
    return {
      types: list.map(function (t) { var on = self.state.type === t.id; return { label: t.label, on: on, off: !on, pick: function () { self.setState({ type: t.id }); } }; }),
      isMove: this.state.type === 'move',
      isReplace: this.state.type === 'replace',
      preview: previews[this.state.type]
    };
  }
}
</script>
</body>
</html>
