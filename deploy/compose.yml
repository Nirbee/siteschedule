# Production stack. Lives in /opt/para on the server next to .env and Caddyfile.
name: para

x-app: &app
  image: ghcr.io/nirbee/siteschedule:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://para:${POSTGRES_PASSWORD}@postgres:5432/para
    STORAGE_DIR: /data/storage
  logging:
    driver: local
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: para
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: para
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U para -d para"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128mb

  app:
    <<: *app
    volumes:
      - storage:/data/storage
    depends_on:
      postgres: { condition: service_healthy }

  bot:
    <<: *app
    command: ["node", "dist/bot/index.cjs"]
    healthcheck: { disable: true }
    environment:
      SITE_API_URL: http://app:3000
    depends_on:
      app: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
